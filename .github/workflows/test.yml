name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Skill front matter
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/check_skills.py

      - name: Install jsdom
        run: npm install --no-save --prefix "$RUNNER_TEMP/deps" jsdom@24

      # The kit tests resolve jsdom from the working directory.
      - name: Review report kit
        working-directory: ${{ runner.temp }}/deps
        run: node --test "$GITHUB_WORKSPACE"/skills/_review-report-kit/tests/*.test.js

      - name: Hub profile builder
        run: node --test skills/lukasz-code-review/hub/*.test.mjs
